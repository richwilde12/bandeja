name: Fetch Padel Availability

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 mins (or adjust as needed)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run script
        env:
          PLAYTOMIC_TOKEN: ${{ secrets.PLAYTOMIC_TOKEN }}
        run: node scripts/fetch.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name "bandeja-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/availability.json
          git commit -m "Auto-update availability [skip ci]" || exit 0
          git push

name: Update availability
on:
  schedule:
    - cron: '*/15 5-22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch.mjs
      - run: |
          git config user.name "bandeja-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/availability.json
          git diff --staged --quiet || (git commit -m "Update availability" && git push)
